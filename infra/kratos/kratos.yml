# Ory Kratos configuration for Project air (ADR-0007), used by the local Compose
# stack and as the production base.
#
# Secrets, the database DSN, the public/admin URLs, the cookie security flag, the
# courier SMTP URI and the browser return URL are NOT stored here: Kratos reads
# the matching environment variables and the Compose stack supplies them
# (names only in infra/compose/.env.example):
#   DSN, SECRETS_COOKIE, SECRETS_CIPHER, SERVE_PUBLIC_BASE_URL,
#   SERVE_ADMIN_BASE_URL, LOG_LEVEL, SESSION_COOKIE_SECURE,
#   COURIER_SMTP_CONNECTION_URI, SELFSERVICE_DEFAULT_BROWSER_RETURN_URL
#
# Kratos owns identities and credentials only; workspace permissions stay in the
# platform and PostgreSQL row-level security (ADR-0005, AD-5).

version: v26.2.0

log:
  level: info
  format: json

serve:
  public:
    base_url: http://127.0.0.1:8433/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:4100
      allowed_methods: [POST, GET, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Cookie, Content-Type, X-Session-Token, X-CSRF-Token]
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
    request_log:
      disable_for_health: true
  admin:
    base_url: http://127.0.0.1:8434/
    request_log:
      disable_for_health: true

selfservice:
  default_browser_return_url: http://127.0.0.1:4100/
  allowed_return_urls:
    - http://127.0.0.1:4100
  methods:
    password:
      enabled: true
    code:
      enabled: true
    link:
      enabled: true
  flows:
    error:
      ui_url: http://127.0.0.1:4100/auth/error
    settings:
      ui_url: http://127.0.0.1:4100/auth/settings
      privileged_session_max_age: 15m
      after:
        default_browser_return_url: http://127.0.0.1:4100/
    recovery:
      enabled: true
      ui_url: http://127.0.0.1:4100/auth/recovery
      use: code
    verification:
      enabled: true
      ui_url: http://127.0.0.1:4100/auth/verification
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:4100/
    logout:
      after:
        default_browser_return_url: http://127.0.0.1:4100/
    login:
      ui_url: http://127.0.0.1:4100/auth/login
      lifespan: 10m
    registration:
      ui_url: http://127.0.0.1:4100/auth/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@project-air.local
    from_name: Project air

session:
  lifespan: 24h
  cookie:
    same_site: Lax
    secure: "false"

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12
