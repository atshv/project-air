# Local development services for Project air: PostgreSQL, SeaweedFS (S3) and Mailpit
# (P0-07), plus the pinned Ory Kratos identity service (P3-01, configured in P3-03).
#
# Shared by every worktree: one stack per machine, fixed host ports outside the slot range
# 4000-4999. Slot databases and buckets are not created here; they come from `.polier-slot`
# and are created by `tools/dev/setup` (P0-06, extended by P3-01). See README.md in this folder.
#
# Images are pinned by tag and digest. Values are local development defaults only; override
# them in `infra/compose/.env` (gitignored). No default is a production secret.

name: project-air-local

services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:01ea903aa65deb58eb49d6e09d859ecff63a6bb7d61feca55f2abad71d08f72a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectair_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-projectair}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command:
      - server
      - -dir=/data
      - -filer
      - -s3
      - -s3.port=8333
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY:-projectair_local_access_key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY:-projectair_local_secret_key}
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_HOST_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_HOST_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Ory Kratos owns identities, credentials and sessions (ADR-0007). Its own
  # database `projectair_kratos` lives on the existing PostgreSQL server and is
  # created by `tools/dev/setup`; it is shared by every local slot and is a
  # local-development limitation only (tests never depend on it).
  #
  # `kratos-migrate` applies the Kratos SQL migrations once before the server
  # starts. Both services are behind the `identity` profile so the default local
  # stack (postgres, seaweedfs, mailpit) keeps `up -d --wait` fast and green.
  # Configuration: infra/kratos/kratos.yml; secrets, DSN and URLs come from the
  # environment (names in .env.example, generated by tools/dev/setup).
  kratos-migrate:
    profiles: ["identity"]
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: ${KRATOS_DSN:-postgres://projectair:projectair_local_only@postgres:5432/projectair_kratos?sslmode=disable}
    command: ["migrate", "sql", "-e", "--yes"]
    restart: "no"

  kratos:
    profiles: ["identity"]
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      DSN: ${KRATOS_DSN:-postgres://projectair:projectair_local_only@postgres:5432/projectair_kratos?sslmode=disable}
      # Local development defaults only; tools/dev/setup generates these values
      # into the gitignored infra/compose/.env and they are never committed.
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:-projectair-local-cookie-secret32}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:-projectair-local-cipher-secret32}
      SERVE_PUBLIC_BASE_URL: http://127.0.0.1:${KRATOS_PUBLIC_HOST_PORT:-8433}/
      SERVE_ADMIN_BASE_URL: http://127.0.0.1:${KRATOS_ADMIN_HOST_PORT:-8434}/
      LOG_LEVEL: ${KRATOS_LOG_LEVEL:-info}
      SESSION_COOKIE_SECURE: ${KRATOS_COOKIE_SECURE:-false}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_CONNECTION_URI:-smtp://mailpit:1025/?disable_starttls=true}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${KRATOS_BROWSER_RETURN_URL:-http://127.0.0.1:4100/}
    ports:
      - "127.0.0.1:${KRATOS_PUBLIC_HOST_PORT:-8433}:4433"
      - "127.0.0.1:${KRATOS_ADMIN_HOST_PORT:-8434}:4434"
    volumes:
      - ../kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command:
      - serve
      - --config
      - /etc/config/kratos/kratos.yml
      - --watch-courier
      - --sqa-opt-out
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4433/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  seaweedfs-data:
  mailpit-data:
