name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Board check, install and gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The checkout is slot 0 (the owner's main checkout); tools/dev/setup refuses it.
      # Install, build and every gate run in a git worktree that holds a non-zero slot.
      CI_WORKTREE: ${{ github.workspace }}/../ci-worktree
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm 12.14.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      # The wrapper clones the tag from board.json (generator_version) and prints the path;
      # nothing from the Polier checkout is committed to this repository.
      - name: Install pinned Polier
        run: |
          POLIER_PATH="$(bash tools/polier.sh --install "$RUNNER_TEMP/polier")"
          echo "POLIER=$POLIER_PATH" >> "$GITHUB_ENV"

      - name: Verify pinned Polier
        run: bash tools/polier.sh --check

      # check.py scans every markdown file under the root, including node_modules/,
      # so the board check runs before the install step.
      - name: Board check
        run: python3 "$POLIER/tools/check.py" .

      - name: Create the CI worktree and its slot
        run: |
          git worktree add --detach "$CI_WORKTREE" HEAD
          python3 "$POLIER/tools/slot.py" acquire --root "$CI_WORKTREE"

      - name: Start the compose stack and the slot database
        working-directory: ${{ env.CI_WORKTREE }}
        run: bash tools/dev/setup

      - name: Install
        working-directory: ${{ env.CI_WORKTREE }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.CI_WORKTREE }}
        run: pnpm build

      - name: Migrate the slot database
        working-directory: ${{ env.CI_WORKTREE }}
        run: |
          # Local-only compose credentials, the same defaults the tests use; nothing secret.
          DB_NAME="$(python3 -c 'import json; print(json.load(open(".polier-slot"))["db_name"])')"
          DATABASE_URL="postgresql://projectair:projectair_local_only@127.0.0.1:5433/${DB_NAME}" \
            node services/platform/dist/db/migrate.js

      - name: Lint
        working-directory: ${{ env.CI_WORKTREE }}
        run: pnpm lint

      - name: Typecheck
        working-directory: ${{ env.CI_WORKTREE }}
        run: pnpm typecheck

      - name: Test
        working-directory: ${{ env.CI_WORKTREE }}
        run: pnpm test

      - name: Boundaries
        working-directory: ${{ env.CI_WORKTREE }}
        run: python3 "$POLIER/tools/boundaries.py" .

      - name: Design check
        working-directory: ${{ env.CI_WORKTREE }}
        run: node tools/design-check/index.mjs .

      - name: Language check
        working-directory: ${{ env.CI_WORKTREE }}
        run: node tools/language-check/index.mjs .

      - name: Change-entry gate
        # Only task/* branches need a .changes entry; workflow_dispatch and other
        # branches skip this gate in the next step.
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/')
        run: |
          TASK="${GITHUB_HEAD_REF#task/}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          node tools/release/check-changes.mjs --task "$TASK" --base "origin/${{ github.base_ref }}"

      - name: Change-entry gate skipped
        if: "github.event_name != 'pull_request' || !startsWith(github.head_ref, 'task/')"
        run: |
          echo "Skipping the change-entry gate: only branches named task/* require a .changes entry."

      - name: Stop the compose stack
        if: always()
        working-directory: ${{ env.CI_WORKTREE }}
        run: docker compose -f infra/compose/compose.yaml down --volumes
