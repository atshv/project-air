<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engine playground — Project air</title>
    <link rel="stylesheet" href="../../packages/ui-kit/tokens.css" />
    <link rel="stylesheet" href="playground.css" />
    <script type="importmap">
      {
        "imports": {
          "@project-air/engine": "../../packages/engine/dist/bridge/engine.js",
          "@project-air/engine/input.js": "../../packages/engine/dist/bridge/input.js",
          "@project-air/engine/overlay.js": "../../packages/engine/dist/bridge/overlay.js",
          "@project-air/engine/zone-parity.js": "../../packages/engine/dist/bridge/zone-parity.js",
          "@project-air/engine/zone-lifecycle.js": "../../packages/engine/dist/bridge/zone-lifecycle.js",
          "@project-air/engine/placement.js": "../../packages/engine/dist/bridge/placement.js",
          "@project-air/engine/keyboard.js": "../../packages/engine/dist/bridge/keyboard.js",
          "@project-air/test-kit": "../../packages/test-kit/dist/scenes.js",
          "@project-air/engine/logic/": "../../packages/engine/dist/logic/packages/engine/src/logic/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="frame">
      <header class="frame__header">
        <h1 class="heading">Engine playground</h1>
        <p class="stage-label">engine-core — interactive board</p>
      </header>
      <div class="canvas-wrap">
        <div class="overlay" id="overlay"></div>
        <div class="header-surface" id="header-surface" aria-hidden="true"></div>
        <canvas
          id="canvas"
          class="canvas"
          width="960"
          height="540"
          role="img"
          aria-label="WebGL2 engine demo: a deterministic board scene"
        >
          Your browser does not support WebGL2.
        </canvas>
        <button
          id="note-add"
          class="note-add"
          type="button"
          hidden
          aria-label="Add note at the placed position"
        >
          Add note
        </button>
      </div>
      <footer class="frame__footer">
        <p class="caption" id="scene-caption">
          Sample board: 500 cards, 50 zones and their blocks. Drag to pan, scroll or pinch to
          zoom.
        </p>
        <dl class="hud" id="hud">
          <div class="hud__item">
            <dt class="hud__label">Objects</dt>
            <dd class="hud__value" id="hud-objects">0</dd>
          </div>
          <div class="hud__item">
            <dt class="hud__label">Cards</dt>
            <dd class="hud__value" id="hud-cards">0</dd>
          </div>
          <div class="hud__item">
            <dt class="hud__label">Zones</dt>
            <dd class="hud__value" id="hud-zones">0</dd>
          </div>
          <div class="hud__item">
            <dt class="hud__label">Visible</dt>
            <dd class="hud__value" id="hud-visible">0</dd>
          </div>
          <div class="hud__item">
            <dt class="hud__label">Frames</dt>
            <dd class="hud__value" id="frames">0</dd>
          </div>
          <div class="hud__item">
            <dt class="hud__label">Backend</dt>
            <dd class="hud__value" id="hud-backend">WebGL2</dd>
          </div>
        </dl>
      </footer>
      <p class="error" id="error" hidden></p>
    </main>

    <div id="context-menu" class="context-menu" role="menu" aria-label="Object actions" hidden>
      <button class="context-menu__item" type="button" role="menuitem" data-intent="open">
        <span class="context-menu__label">Open</span><span class="context-menu__shortcut">Enter</span>
      </button>
      <button class="context-menu__item" type="button" role="menuitem" data-intent="duplicate">
        <span class="context-menu__label">Duplicate</span><span class="context-menu__shortcut">⌘D</span>
      </button>
      <button class="context-menu__item" type="button" role="menuitem" data-intent="bring-forward">
        <span class="context-menu__label">Bring forward</span><span class="context-menu__shortcut"></span>
      </button>
      <button class="context-menu__item" type="button" role="menuitem" data-intent="send-backward">
        <span class="context-menu__label">Send backward</span><span class="context-menu__shortcut"></span>
      </button>
      <button class="context-menu__item" type="button" role="menuitem" data-intent="delete">
        <span class="context-menu__label">Delete</span><span class="context-menu__shortcut">Del</span>
      </button>
    </div>
    <output id="history-hint" class="history-hint" aria-live="polite" hidden></output>
  </body>
</html>
